{% extends 'base.html' %}
{% block title %}Удаление проекта{% endblock %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2>Удалить проект "{{ project.name }}"?</h2>
            <p class="text-danger">Все задачи проекта тоже будут удалены.</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">Удалить</button>
                    <a href="{% url 'project_detail' project.pk %}" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
