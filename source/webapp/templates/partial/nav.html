<nav class="navbar bg-body-tertiary">
    <div class="container d-flex gap-2">
        <a class="navbar-brand" href="{% url 'index' %}">
            <i class="bi bi-kanban me-2"></i>Проекты
        </a>
        <div class="d-flex align-items-center gap-3">
            {% if user.is_authenticated %}
                <a class="nav-link" href="{% url 'project_create' %}">
                    <i class="bi bi-folder-plus me-2"></i>Добавить проект
                </a>
                <span class="navbar-text">Привет, {{ user.username }}!</span>
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-secondary btn-sm">Выход</button>
                </form>
            {% else %}
                <a class="nav-link" href="{% url 'accounts:login' %}">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Вход
                </a>
            {% endif %}
        </div>
    </div>
</nav>
