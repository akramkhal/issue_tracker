<nav class="my-3">
    <ul class="pagination justify-content-center">
        <li class="page-item">
            <a class="page-link" href="?{% if query %}{{ query }}&{% endif %}page=1">&laquo; В начало</a>
        </li>
        {% if page_obj.has_previous %}
            <li class="page-item">
                <a class="page-link" href="?{% if query %}{{ query }}&{% endif %}page={{ page_obj.previous_page_number }}">Назад</a>
            </li>
        {% else %}
            <li class="page-item disabled"><span class="page-link">Назад</span></li>
        {% endif %}

        <li class="page-item active">
            <span class="page-link">{{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>
        </li>

        {% if page_obj.has_next %}
            <li class="page-item">
                <a class="page-link" href="?{% if query %}{{ query }}&{% endif %}page={{ page_obj.next_page_number }}">Далее</a>
            </li>
        {% else %}
            <li class="page-item disabled"><span class="page-link">Далее</span></li>
        {% endif %}
        <li class="page-item">
            <a class="page-link" href="?{% if query %}{{ query }}&{% endif %}page={{ page_obj.paginator.num_pages }}">В конец &raquo;</a>
        </li>
    </ul>
</nav>
