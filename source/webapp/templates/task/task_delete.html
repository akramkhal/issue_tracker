{% extends 'base.html' %}
{% block title %}Удаление Задачи{% endblock %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2>Удалить запись "{{ task.summary }}"?</h2>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">Удалить</button>
                    <a href="{% url 'task_detail' task.pk %}" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
